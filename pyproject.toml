[project]
name = "consultoria-crm"
version = "0.1.0"
description = "Local-first CRM for a small AI consultancy: FastAPI + HTMX + MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "argon2-cffi>=23.1",
    "tzdata>=2024.2",
]

[project.scripts]
crm = "crm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
